<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Движения СПГ-перевозчиков</title>
<meta name="description" content="Интерактивная карта движения семи СПГ-перевозчиков за три недели: треки, предполагаемые маршруты, судозаходы, истории названий и флагов, санкции.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0079C2">
<meta property="og:type" content="website">
<meta property="og:title" content="Движения СПГ-перевозчиков">
<meta property="og:description" content="Треки семи СПГ-перевозчиков, судозаходы, флаги и санкции. Данные: Lloyd’s List Intelligence Seasearcher.">
<meta property="og:locale" content="ru_RU">

<style>
:root{
  --accent:#0079C2; --ink:#222B33; --muted:#78858F; --line:#E2E8ED;
  --land:#D8E9F5; --coast:#B7D2E4; --grid:#EDF2F6; --bord:#C2D9E8;
  --cntry:#8DA7B9; --geo:#9FB2BF; --panel:#FFFFFF; --bg:#F7FAFC;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,Helvetica,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100%}

header{
  padding:10px 18px 9px; background:#fff; border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;flex:0 0 auto;
}
h1{margin:0;font-size:22px;font-weight:700;color:var(--accent);letter-spacing:-.2px}
#sub{font-size:12px;color:var(--muted);margin-top:2px}
#play{
  font:inherit;font-size:12.5px;margin-left:auto;display:flex;align-items:center;gap:7px;
  padding:7px 14px 7px 12px;border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:7px;cursor:pointer;
}
#play:hover{background:#F1F6FA;color:var(--ink)}
#play[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#play svg{width:11px;height:11px;flex:0 0 auto}
#weeks{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#weeks button{
  font:inherit;font-size:12.5px;padding:7px 15px;border:0;background:#fff;color:var(--muted);
  cursor:pointer;border-left:1px solid var(--line);
}
#weeks button:first-child{border-left:0}
#weeks button:hover{background:#F1F6FA;color:var(--ink)}
#weeks button[aria-pressed="true"]{background:var(--accent);color:#fff}

main{flex:1 1 auto;display:flex;min-height:0}
#mapwrap{flex:1 1 auto;position:relative;min-width:0;background:#fff}
svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}

#tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#tools button{
  font:inherit;font-size:12px;width:30px;height:30px;border:1px solid var(--line);
  background:#fff;border-radius:6px;cursor:pointer;color:var(--ink);line-height:1;
}
#tools button:hover{background:#F1F6FA}
#layers{
  position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(255,255,255,.93);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;
}
#layers label{display:block;cursor:pointer;padding:2px 0;color:var(--muted)}
#layers input{vertical-align:-1px;margin-right:6px;accent-color:var(--accent)}
#legend{
  position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.93);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:11.5px;color:var(--muted);
}
#legend div{display:flex;align-items:center;gap:7px;padding:1.5px 0}
#legend svg{width:26px;height:10px;flex:0 0 auto}

/* ---------- телефон и узкий экран ---------- */
#mobctl{display:none}
@media (max-width:820px){
  body{overflow:auto;-webkit-text-size-adjust:100%}
  #app{height:auto;min-height:100%}
  header{padding:9px 13px 10px;gap:9px 12px;align-items:center}
  h1{font-size:18px}
  #sub{font-size:11.5px}
  #play{margin-left:auto;padding:8px 14px}
  #weeks{flex:1 1 100%}
  #weeks button{flex:1 1 0;padding:9px 4px}
  main{flex-direction:column;min-height:0}
  #mapwrap{flex:0 0 auto;height:min(58vh,86vw);min-height:290px;
    border-bottom:1px solid var(--line)}
  #tools button{width:36px;height:36px;font-size:15px}
  aside{flex:0 0 auto;border-left:0}
  #list{max-height:none;overflow:visible}
  #detail{overflow:visible;padding:13px 13px 24px}
  details .inner{max-height:52vh}
  .row{padding:9px 13px}
  #mobctl{display:block;padding:11px 13px 12px;background:#FBFDFE;
    border-bottom:1px solid var(--line)}
  #mobctl #layers,#mobctl #legend{position:static;background:none;border:0;
    border-radius:0;padding:0;font-size:12px}
  #mobctl #layers{columns:2;column-gap:14px;margin-bottom:9px}
  #mobctl #legend{border-top:1px solid var(--line);padding-top:9px}
  #tip{display:none}
}
@media (max-width:420px){
  h1{font-size:16.5px}
  #mobctl #layers{columns:1}
}

#tip{
  position:absolute;pointer-events:none;background:rgba(34,43,51,.93);color:#fff;
  font-size:11.5px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .09s;
  white-space:nowrap;z-index:5;line-height:1.45;
}

aside{
  flex:0 0 352px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#list{overflow-y:auto;flex:0 0 auto;max-height:54%;border-bottom:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:9px;padding:6px 13px;cursor:pointer;
  border-bottom:1px solid #F1F5F8;
}
.row:hover{background:#F5F9FC}
.row[aria-selected="true"]{background:#EAF4FB}
.row .bar{width:4px;height:26px;border-radius:2px;flex:0 0 auto}
.row .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.row .mt{font-size:11.5px;color:var(--muted);line-height:1.25}
.row .tx{flex:1 1 auto;min-width:0}
.row .tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input{accent-color:var(--accent);flex:0 0 auto}
.row.off .tx{opacity:.4}
.warn{color:#C2185B;font-weight:700}

#detail{flex:1 1 auto;overflow-y:auto;padding:13px 15px 22px}
#detail h2{margin:0 0 2px;font-size:17px}
#detail .hint{font-size:12px;color:var(--muted);line-height:1.5}
@keyframes pulse{
  0%{transform:scale(.55);opacity:.50}
  65%{opacity:0}
  100%{transform:scale(2.7);opacity:0}
}
.pulse circle{transform-origin:0 0;transform-box:fill-box;animation:pulse 2.3s ease-out infinite}
.pulse circle:nth-child(2){animation-delay:1.15s}
.pulse.slow circle{animation-duration:4.2s;opacity:.6}
.pulse.slow circle:nth-child(2){animation-delay:2.1s}
@media (prefers-reduced-motion:reduce){.pulse circle{animation:none;opacity:0}}

.photo{margin:10px 0 2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.photo img{display:block;width:100%;height:auto;background:#EFF5F9}
.photo .cap{font-size:10.5px;color:var(--muted);padding:4px 8px 5px;line-height:1.35}
details{border-top:1px solid var(--line)}
details:first-of-type{margin-top:13px}
details>summary{cursor:pointer;list-style:none;padding:8px 0 7px;font-size:12px;
  text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  display:flex;align-items:center;gap:8px;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'';flex:0 0 auto;width:0;height:0;margin-left:2px;
  border:4.5px solid transparent;border-left-color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg) translate(-1px,2px)}
details>summary:hover{color:var(--ink)}
details .cnt{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;
  font-variant-numeric:tabular-nums}
details .inner{padding-bottom:11px;max-height:360px;overflow-y:auto}
details .inner table{font-size:11px}
details .inner th{position:sticky;top:0;background:#fff;z-index:1}
.why{font-size:11.5px;line-height:1.5;color:var(--muted);padding:7px 0 2px}
.phot{margin-top:9px}
.phot a{color:var(--accent)}
dl{margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 11px;font-size:12.5px}
dt{color:var(--muted);white-space:nowrap}
dd{margin:0}
h3{margin:15px 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);padding:3px 5px 3px 0}
td{padding:3px 5px 3px 0;border-bottom:1px solid #F1F5F8;vertical-align:top}
#locate{
  font:inherit;font-size:12px;margin-top:10px;padding:6px 12px;border:1px solid var(--line);
  background:#fff;border-radius:6px;cursor:pointer;color:var(--accent);font-weight:700;
}
#locate:hover{background:#F1F6FA}
.note{
  font-size:12px;line-height:1.5;background:#F4F9FC;border-left:3px solid var(--accent);
  padding:8px 10px;border-radius:0 5px 5px 0;margin-top:11px;
}
.note.route{border-left-color:#C9741F;background:#FDF6EF}
footer{
  flex:0 0 auto;padding:7px 18px 9px;background:#fff;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);line-height:1.5;
}
@media (max-width:980px){
  main{flex-direction:column}
  aside{flex:0 0 auto;max-height:46%;border-left:0;border-top:1px solid var(--line)}
  #list{max-height:38%}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Движения СПГ-перевозчиков</h1>
      <div id="sub"></div>
    </div>
    <button id="play" aria-pressed="false"></button>
    <div id="weeks"></div>
  </header>

  <main>
    <div id="mapwrap">
      <svg id="map"></svg>
      <div id="tools">
        <button id="zin" title="Приблизить">+</button>
        <button id="zout" title="Отдалить">−</button>
        <button id="zfit" title="Показать всё">⤢</button>
      </div>
      <div id="layers">
        <label><input type="checkbox" id="cRoutes" checked> предполагаемые маршруты</label>
        <label><input type="checkbox" id="cPlaces" checked> порты и терминалы</label>
        <label><input type="checkbox" id="cCountries" checked> названия стран</label>
        <label><input type="checkbox" id="cGrid" checked> координатная сетка</label>
      </div>
      <div id="legend"></div>
      <div id="tip"></div>
    </div>

    <aside>
      <div id="mobctl"></div>
      <div id="list"></div>
      <div id="detail"></div>
    </aside>
  </main>

  <footer id="foot"></footer>
</div>

/* ---------- проекция Меркатора ---------- */
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const my = la => Math.log(Math.tan(Math.PI / 4 + Math.max(-85, Math.min(85, la)) * D2R / 2)) * R2D;
const prj = ([lo, la]) => [lo, -my(la)];
const BOUNDS = (() => {
  const x0 = -27, x1 = 152, y0 = -my(67), y1 = -my(-42);
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
})();

/* ---------- состояние ---------- */
const S = {
  week: DATA.snapshots.length - 1,
  sel: null,
  on: Object.fromEntries(DATA.vessels.map(v => [v.id, true])),
  k: 1, tx: 0, ty: 0, vw: 1, vh: 1, t: 1, rt: 1, anim: {},

/* ---------- SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';

svg.append(gWorld, gOver);
const L = {};
['grid', 'land', 'lakes', 'bord', 'zone', 'route', 'track'].forEach(n => { L[n] = el('g'); gWorld.append(L[n]); });

const toS = ([x, y]) => [x * S.k + S.tx, y * S.k + S.ty];
const pathOf = pts => pts.map((p, i) => (i ? 'L' : 'M') + prj(p).map(v => v.toFixed(2)).join(' ')).join('');

/* ---------- статическая география ---------- */
function drawGeo() {
  for (let lo = -20; lo <= 150; lo += 20)
    L.grid.append(el('path', { d: `M${lo} ${-my(67)}L${lo} ${-my(-42)}`, class: 'gl' }));
  for (let la = -30; la <= 60; la += 15)
    L.grid.append(el('path', { d: `M-27 ${-my(la)}L152 ${-my(la)}`, class: 'gl' }));
  L.grid.querySelectorAll('.gl').forEach(p => {
    p.setAttribute('stroke', 'var(--grid)'); p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', '1'); p.setAttribute('vector-effect', 'non-scaling-stroke');
  });
  DATA.geo.land.forEach(poly => L.land.append(el('path', {
    d: pathOf(poly) + 'Z', fill: 'var(--land)', stroke: 'var(--coast)',
    'stroke-width': '1', 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round'
  })));
  DATA.geo.borders.forEach(b => L.bord.append(el('path', {
    d: pathOf(b), fill: 'none', stroke: 'var(--bord)', 'stroke-width': '1',
    'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  })));
  DATA.geo.lakes.forEach(poly => L.lakes.append(el('path', {
    d: pathOf(poly) + 'Z', fill: '#fff', stroke: 'var(--coast)',
    'stroke-width': '1', 'vector-effect': 'non-scaling-stroke'
  })));
}

/* ---------- слои недели ---------- */
function drawWeek() {
  [L.zone, L.route, L.track].forEach(g => g.replaceChildren());
  const sp = snap();
  const vis = id => S.on[id] && (!S.sel || S.sel === id);
  const dim = id => (S.sel && S.sel !== id) ? 0.22 : 1;

  RT = {};
  if (S.layers.routes && S.week === DATA.snapshots.length - 1) {
    for (const id in DATA.routes) {
      if (!S.on[id]) continue;
      const pe = el('path', {
        d: '', fill: 'none', stroke: vesselById(id).color,
        'stroke-width': '1.6', 'stroke-dasharray': '3 4', 'stroke-linecap': 'round',
        'vector-effect': 'non-scaling-stroke', opacity: 0.55 * dim(id)
      });
      L.route.append(pe);
      RT[id] = { pts: DATA.routes[id], pe };
    }
  }
  if (sp.zone) for (const id in sp.zone) {
    if (!S.on[id]) continue;
    const [[a, b], [c, d]] = sp.zone[id];
    const cx = (a + c) / 2, cy = (-my(b) + -my(d)) / 2;
    L.zone.append(el('ellipse', {
      cx, cy, rx: Math.abs(c - a) / 2 * 1.25, ry: Math.abs(my(b) - my(d)) / 2 * 1.25,
      fill: vesselById(id).color, opacity: 0.16 * dim(id), stroke: 'none'
    }));
  }
  TR = {};
  for (const id in sp.tracks) {
    if (!S.on[id]) continue;
    const c = vesselById(id).color;
    const base = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
                   'vector-effect': 'non-scaling-stroke', opacity: dim(id) };
    const pw = el('path', Object.assign({ stroke: '#fff', 'stroke-width': '5.5' }, base));
    const pc = el('path', Object.assign({ stroke: c, 'stroke-width': '2.6' }, base));
    L.track.append(pw, pc);
    TR[id] = { pts: sp.tracks[id], pw, pc };
  }
  applyProgress(S.t, false); applyRoute(S.rt);
}

/* ---------- движение судна по треку ---------- */
let TR = {}, RT = {};
function partial(pts, t) {
  if (!Array.isArray(pts) || pts.length < 2) return { d: pts ? pathOf(pts) : '', pt: pts && pts[0], seg: null };
  const n = pts.length - 1;
  if (!(t > 0)) return { d: pathOf([pts[0]]), pt: pts[0], seg: [pts[0], pts[1]] };
  if (t >= 1) return { d: pathOf(pts), pt: pts[n], seg: [pts[n - 1], pts[n]] };
  const f = t * n, i = Math.max(0, Math.min(n - 1, Math.floor(f))), r = f - i;
  const a = pts[i], b = pts[i + 1];
  const cur = [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r];
  return { d: pathOf(pts.slice(0, i + 1).concat([cur])), pt: cur, seg: [a, b] };
}
function applyRoute(t) {
  for (const id in RT) RT[id].pe.setAttribute('d', partial(RT[id].pts, t).d);
}
function applyProgress(t, redraw = true) {
  S.anim = {};
  for (const id in TR) {
    const o = TR[id], r = partial(o.pts, t);
    o.pw.setAttribute('d', r.d); o.pc.setAttribute('d', r.d);
    S.anim[id] = r;
  }
  if (redraw) drawOverlay();
}

/* ---------- оверлей: маркеры и подписи в экранных координатах ---------- */
const dms = (v, pos, neg) => {
  const s = v < 0 ? neg : pos, a = Math.abs(v), d = Math.floor(a),
    m = Math.floor((a - d) * 60), sec = Math.round((((a - d) * 60) - m) * 60);
  return `${d}°${String(m).padStart(2, '0')}′${String(sec).padStart(2, '0')}″${s}`;
};
const txt = (x, y, s, o = {}) => {
  o = Object.assign({}, o); if (o.fs) o.fs *= (S.ts || 1); else o.fs = 11 * (S.ts || 1);
  const t = el('text', Object.assign({ x, y, 'font-size': o.fs, fill: o.fill || 'var(--ink)',
    'text-anchor': o.ta || 'middle', 'dominant-baseline': 'middle' }, o.attr || {}));
  if (o.bold) t.setAttribute('font-weight', '700');
  String(s).split('\n').forEach((line, i, arr) => {
    const ts = el('tspan', { x, dy: i ? (o.fs || 11) * 1.15 : -((arr.length - 1) * (o.fs || 11) * 1.15) / 2 });
    ts.textContent = line; t.append(ts);
  });
  if (o.halo) { t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', '2.6'); t.setAttribute('stroke-linejoin', 'round'); }
  return t;
};

const MINOR = new Set(['Находка', 'Клифден', 'Ричардс-Бей', 'Порт-Луи']);
/* ---------- маркеры судов: пульсирующая точка + короткая стрелка ---------- */
function dotMarker(p, color, moving, sel) {
  const g = el('g');
  const r = sel ? 6.4 : 5.2;
  const pw = el('g', { class: moving ? 'pulse' : 'pulse slow',
    transform: `translate(${p[0]} ${p[1]})` });
  pw.append(el('circle', { r, fill: color }));
  pw.append(el('circle', { r, fill: color }));
  g.append(pw);
  if (!moving) g.append(el('circle', { cx: p[0], cy: p[1], r: r + 4.6, fill: 'none',
    stroke: color, 'stroke-width': 1.25, 'stroke-dasharray': '2.2 2.1', opacity: .9 }));
  g.append(el('circle', { cx: p[0], cy: p[1], r, fill: color,
    stroke: '#fff', 'stroke-width': 1.7 }));
  return g;
}
function dirArrow(p, color, dir, sel) {
  const a = sel ? 1.18 : 1, x0 = 8.5 * a, x1 = 22 * a, hw = 3.9 * a;
  const d = `M${x0} 0L${x1} 0M${x1 - 5 * a} ${-hw}L${x1} 0L${x1 - 5 * a} ${hw}`;
  const g = el('g', { transform: `translate(${p[0]} ${p[1]}) rotate(${dir.toFixed(1)})` });
  g.append(el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 3.6 * a,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9 }));
  g.append(el('path', { d, fill: 'none', stroke: color, 'stroke-width': 1.9 * a,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  return g;
}
const nf = x => String(x).replace('.', ',');
const gr = x => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
const brg = (p1, p2) => {
  const A = toS(prj(p1)), B = toS(prj(p2));
  const dx = B[0] - A[0], dy = B[1] - A[1];
  return (dx || dy) ? Math.atan2(dy, dx) * 180 / Math.PI : null;
};
function drawOverlay() {
  gOver.replaceChildren();
  const sp = snap(), inView = ([x, y]) => x > -40 && x < S.vw + 40 && y > -30 && y < S.vh + 30;

  if (S.layers.grid) {
    for (let lo = -20; lo <= 150; lo += 40) {
      const [x, y] = toS([lo, -my(64.5)]);
      if (x > 6 && x < S.vw - 6) gOver.append(txt(x, Math.max(14, y), Math.abs(lo) + '°' + (lo < 0 ? 'з' : lo > 0 ? 'в' : ''), { fs: 9.5, fill: '#A6B5C0', halo: 1 }));
    }
    for (let la = -30; la <= 60; la += 30) {
      const [x, y] = toS([-23.5, -my(la)]);
      if (y > 10 && y < S.vh - 10) gOver.append(txt(Math.max(22, x), y, Math.abs(la) + '°' + (la < 0 ? 'ю' : la > 0 ? 'с' : ''), { fs: 9.5, fill: '#A6B5C0', halo: 1 }));
    }
  }
  const zl = Math.log2(Math.max(1, S.k / K0));
  const minFs = 4.42 - 0.28 * zl;
  if (S.layers.countries) DATA.geo.countries.forEach(([lo, la, n, fs]) => {
    if (fs < minFs) return;
    const p = toS(prj([lo, la])); if (!inView(p)) return;
    const size = Math.min(16, Math.max(8.5, fs * 2.0 * Math.pow(S.k, 0.22)));
    gOver.append(txt(p[0], p[1], n, { fs: size, fill: 'var(--cntry)' }));
  });
  DATA.places.seas.forEach(([lo, la, n]) => {
    const p = toS(prj([lo, la])); if (!inView(p)) return;
    gOver.append(txt(p[0], p[1], n, { fs: Math.min(15, 10.5 * Math.pow(S.k, 0.18)), fill: 'var(--geo)' }));
  });
  if (S.layers.places) {
    DATA.places.ports.forEach(([lo, la, n]) => {
      if (MINOR.has(n) && zl < 0.7) return;
      const p = toS(prj([lo, la])); if (!inView(p)) return;
      gOver.append(el('circle', { cx: p[0], cy: p[1], r: 3.2, fill: '#fff', stroke: 'var(--muted)', 'stroke-width': 1.3 }));
      gOver.append(txt(p[0], p[1] - 10, n, { fs: 10.5, fill: 'var(--muted)', halo: 1 }));
    });
    DATA.places.terminals.forEach(([lo, la, n]) => {
      const p = toS(prj([lo, la])); if (!inView(p)) return;
      gOver.append(el('rect', { x: p[0] - 4.5, y: p[1] - 4.5, width: 9, height: 9, fill: 'var(--ink)', stroke: '#fff', 'stroke-width': 1.4 }));
      gOver.append(txt(p[0], p[1] - 13, n, { fs: 11.5, bold: 1, fill: 'var(--ink)', halo: 1 }));
    });
  }

  DATA.vessels.forEach(v => {
    const d = sp.pos[v.id]; if (!d || !S.on[v.id]) return;
    const a = S.anim[v.id];
    const ll = (a && a.pt) ? a.pt : d.ll;
    const p = toS(prj(ll)); if (!inView(p)) return;
    const faded = S.sel && S.sel !== v.id, op = faded ? 0.3 : 1;
    const g = el('g', { opacity: op, style: 'cursor:pointer' });
    const moving = parseFloat(String(d.sp).replace(',', '.')) > 1 && !d.stale;
    let dir = a && a.seg ? brg(a.seg[0], a.seg[1]) : null;
    if (dir === null && DATA.routes[v.id] && S.week === DATA.snapshots.length - 1)
      dir = brg(d.ll, DATA.routes[v.id][1]);
    if (dir === null) dir = 0;
    const sel = S.sel === v.id;
    if (moving) g.append(dirArrow(p, v.color, dir, sel));
    g.append(dotMarker(p, v.color, moving, sel));
    /* подпись: если уходит за край — переносим на другую сторону и поджимаем */
    const lb = v.lab || [0, -20];
    let lx = p[0] + lb[0], ly = p[1] + lb[1];
    let ta = lb[0] > 6 ? 'start' : lb[0] < -6 ? 'end' : 'middle';
    const room = 9 + v.name.length * 6.6 * (S.ts || 1);
    if (ta === 'end' && lx - room < 0) { lx = p[0] + Math.abs(lb[0]); ta = 'start'; }
    else if (ta === 'start' && lx + room > S.vw) { lx = p[0] - Math.abs(lb[0]); ta = 'end'; }
    else if (ta === 'middle') lx = Math.max(room / 2, Math.min(S.vw - room / 2, lx));
    if (ta === 'start') lx = Math.min(lx, S.vw - room);
    if (ta === 'end') lx = Math.max(lx, room);
    ly = Math.max(11, Math.min(S.vh - 9, ly));
    g.append(txt(lx, ly, v.name, { fs: 12.5, bold: 1, fill: v.color, halo: 1, ta }));
    if (lb[0] || lb[1]) g.append(el('line', { x1: p[0], y1: p[1],
      x2: p[0] + (lx - p[0]) * 0.78, y2: p[1] + (ly - p[1]) * 0.78,
      stroke: v.color, 'stroke-width': 1, opacity: .5 }));
    g.addEventListener('pointerenter', ev => showTip(ev, v, d));
    g.addEventListener('pointermove', ev => showTip(ev, v, d));
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('click', ev => { ev.stopPropagation(); select(S.sel === v.id ? null : v.id); });
    gOver.append(g);

  /* квадрат терминала поверх точек: судно у причала не должен его закрывать */
  if (S.layers.places) DATA.places.terminals.forEach(([lo, la]) => {
    const p = toS(prj([lo, la])); if (!inView(p)) return;
    gOver.append(el('rect', { x: p[0] - 4.5, y: p[1] - 4.5, width: 9, height: 9,
      fill: 'var(--ink)', stroke: '#fff', 'stroke-width': 1.4 }));
  });
}

/* ---------- подсказка ---------- */
const tip = document.getElementById('tip');
function showTip(ev, v, d) {
  const r = document.getElementById('mapwrap').getBoundingClientRect();
  tip.innerHTML = `<b>${v.name}</b><br>${d.t}${d.stale ? ' ⚠ устарело' : ''}<br>`
    + `${dms(d.ll[1], 'N', 'S')} ${dms(d.ll[0], 'E', 'W')}<br>ход ${d.sp} уз · осадка ${d.dr} м`;
  tip.style.opacity = 1;
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  tip.style.left = Math.min(x + 14, r.width - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(6, y - tip.offsetHeight - 12) + 'px';
}
const hideTip = () => tip.style.opacity = 0;

/* ---------- боковая панель ---------- */
function drawList() {
  const sp = snap(), box = document.getElementById('list');
  box.replaceChildren();
  DATA.vessels.forEach(v => {
    const d = sp.pos[v.id];
    const row = document.createElement('div');
    row.className = 'row' + (S.on[v.id] ? '' : ' off');
    row.setAttribute('aria-selected', S.sel === v.id);
    if (!d) row.style.opacity = .45;
    row.innerHTML = `<input type="checkbox" ${S.on[v.id] ? 'checked' : ''} ${d ? '' : 'disabled'}>
      <div class="bar" style="background:${v.color}"></div>
      <div class="tx"><div class="nm" style="color:${v.color}">${v.name}</div>
      <div class="mt">${d ? (d.stale ? '<span class="warn">данные устарели · ' + d.t + '</span>'
        : d.t + ' · ход ' + d.sp + ' уз') : 'нет в этом срезе'}</div>
      <div class="mt">${d ? d.near : ''}</div></div>`;
    row.querySelector('input').addEventListener('click', e => {
      e.stopPropagation(); S.on[v.id] = e.target.checked; render();
    });
    if (d) row.addEventListener('click', () => select(S.sel === v.id ? null : v.id));
    box.append(row);
  });
}

function drawDetail() {
  const sp = snap(), box = document.getElementById('detail');
  if (!S.sel) {
    box.innerHTML = `<h2>${sp.title}</h2>
      <div class="hint">${sp.summary}</div>
      <div class="note">Выберите судно в списке или на карте — покажу его карточку,
      параметры AIS и историю судозаходов за полгода.</div>
      <h3>Источник</h3><div class="hint">Lloyd’s List Intelligence Seasearcher:
      снимки экрана ${sp.shot} — положение, треки и параметры AIS;
      выгрузки Movements, Registration и Sanction Details — судозаходы,
      истории названий и флагов, санкции; оттуда же фотографии судов.</div>`;
    return;
  }
  const v = vesselById(S.sel), d = sp.pos[S.sel], calls = DATA.calls[S.sel], s = v.spec || {};
  const ph = DATA.photos[S.sel];
  let h = `<h2 style="color:${v.color}">${v.name}</h2>
    <div class="hint">${v.flag} · IMO ${v.imo} · MMSI ${v.mmsi}</div>`;
  if (ph) h += `<div class="photo"><img src="${ph}" alt="${v.name}" loading="lazy">
    <div class="cap">Фото: Lloyd’s List Intelligence Seasearcher</div></div>`;
  h += `<dl><dt>Тип</dt><dd>${v.type}</dd><dt>Класс</dt><dd>${v.cls}</dd>`;
  if (s.built) h += `<dt>Постройка</dt><dd>${s.built}${s.yard ? ' · ' + s.yard : ''}</dd>`;
  if (s.loa) h += `<dt>Длина × ширина</dt><dd>${nf(s.loa)} × ${nf(s.beam)} м</dd>`;
  if (s.cap) h += `<dt>Ёмкость танков</dt><dd>${s.cap}</dd>`;
  if (s.gt) h += `<dt>Тоннаж</dt><dd>GT ${gr(s.gt)} · DWT ${gr(s.dwt)}</dd>`;
  else if (s.dwt) h += `<dt>Тоннаж</dt><dd>DWT ${gr(s.dwt)}</dd>`;
  if (s.ice) h += `<dt>Лёд</dt><dd>${s.ice}</dd>`;
  if (s.spd) h += `<dt>Скорость</dt><dd>${s.spd}</dd>`;
  if (d) {
    h += `<dt>Снимок</dt><dd>${d.t}${d.stale ? ' <span class="warn">⚠ устарело</span>' : ''}</dd>
      <dt>Координаты</dt><dd>${dms(d.ll[1], 'N', 'S')} ${dms(d.ll[0], 'E', 'W')}</dd>
      <dt>Ближайшая точка</dt><dd>${d.near}</dd>
      <dt>Осадка</dt><dd>${d.dr} м</dd><dt>Ход</dt><dd>${d.sp} уз</dd>
      ${d.st ? `<dt>Статус</dt><dd>${d.st}</dd>` : ''}
      <dt>Назначение</dt><dd>${d.dest}</dd><dt>ETA</dt><dd>${d.eta}</dd>`;
  }
  h += `</dl>`;
  if (d) h += `<button id="locate">Показать на карте</button>`;
  h += `<div class="note">${v.note}</div>`;
  if (DATA.routeNote[S.sel] && S.week === DATA.snapshots.length - 1)
    h += `<div class="note route">${DATA.routeNote[S.sel]}</div>`;

  const sec = (title, n, body) => `<details><summary>${title}`
    + (n == null ? '' : `<span class="cnt">${n}</span>`)
    + `</summary><div class="inner">${body}</div></details>`;
  const tbl = (head, rows) => `<table><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>`
    + rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('') + `</table>`;

  const nm = DATA.names[S.sel];
  if (nm) h += sec('История названий', nm.length,
    tbl(['Название', 'С', 'По'], nm.map(r => [`<b>${r[0]}</b>`, r[1], r[2]])));

  const fl = DATA.flags[S.sel];
  if (fl) h += sec('История флагов', fl.length,
    tbl(['Флаг', 'Позывной', 'MMSI', 'Порт припис.', 'С', 'По'],
        fl.map(r => [`<b>${r[0]}</b>`, r[1], r[2], r[3], r[4], r[5]])));

  const sn = DATA.sanc[S.sel];
  if (sn) {
    let b = tbl(['Орган', 'Дата', 'Программа и примечание'],
      sn.map(r => [`<b>${r[0]}</b>`, r[1],
        `${r[2]}${r[3] && r[3] !== '—' ? '<br><span style="color:var(--muted)">' + r[3] + '</span>' : ''}`]));
    if (DATA.why[S.sel]) b += `<div class="why">Основание. ${DATA.why[S.sel]}</div>`;
    h += sec('Санкции', sn.length, b);
  } else if (DATA.nosanc[S.sel]) {
    h += sec('Санкции', null, `<div class="hint">${DATA.nosanc[S.sel]}</div>`);
  }

  if (calls && calls.length) h += sec('Судозаходы', calls.length,
    tbl(['Место', 'Приход', 'Отход', 'Стоянка'], calls.map(c =>
      [`<b>${c[0]}</b>${c[6] ? '<br><span style="color:var(--muted)">' + c[6] + '</span>' : ''}`
       + `<br><span style="color:var(--muted)">${c[1]}${c[5] ? ' → ' + c[5] : ''}</span>`,
       c[2], c[3], c[4]])));
  else h += sec('Судозаходы', null, `<div class="hint">Выгрузка по этому судну не предоставлена.</div>`);

  if (s.link) h += `<div class="hint phot">Карточка судна в открытых базах:
    <a href="${s.link}" target="_blank" rel="noopener">VesselFinder</a> ·
    <a href="https://www.marinetraffic.com/en/ais/details/ships/imo:${v.imo}"
       target="_blank" rel="noopener">MarineTraffic</a>.</div>`;
  box.innerHTML = h;
  box.scrollTop = 0;
  const lb = document.getElementById('locate');
  if (lb) lb.onclick = () => zoomTo(d.ll[0], d.ll[1], Math.max(S.k, K0 * 4.5));
}

function select(id) { S.sel = id; if (!playing) { S.t = 1; S.rt = 1; } render(); }

/* ---------- зум и панорама ---------- */
function fit(pad) {
  if (pad === undefined) pad = S.vw < 700 ? 0.1 : 0.03;
  const sx = S.vw / BOUNDS.w, sy = S.vh / BOUNDS.h;
  S.k = Math.min(sx, sy) * (1 - pad);
  S.tx = S.vw / 2 - (BOUNDS.x0 + BOUNDS.w / 2) * S.k;
  S.ty = S.vh / 2 - (BOUNDS.y0 + BOUNDS.h / 2) * S.k;
}
let K0 = 1;
function clampK(k) { return Math.max(K0 * 0.9, Math.min(K0 * 26, k)); }
function applyT() { gWorld.setAttribute('transform', `translate(${S.tx} ${S.ty}) scale(${S.k})`); }
function zoomAt(cx, cy, f) {
  const k2 = clampK(S.k * f), r = k2 / S.k;
  S.tx = cx - (cx - S.tx) * r; S.ty = cy - (cy - S.ty) * r; S.k = k2;
  applyT(); drawOverlay();
}
function zoomTo(lo, la, k) {
  S.k = clampK(k); S.tx = S.vw / 2 - lo * S.k; S.ty = S.vh / 2 - (-my(la)) * S.k;
  applyT(); drawOverlay();
}

function resize() {
  const r = document.getElementById('mapwrap').getBoundingClientRect();
  S.vw = r.width; S.vh = r.height;
  svg.setAttribute('viewBox', `0 0 ${S.vw} ${S.vh}`);
  S.ts = S.vw < 700 ? 0.84 : 1;
  layoutControls();
  fit(); K0 = S.k; applyT(); drawOverlay();
}

/* На узком экране слои и легенда уезжают из-под карты в панель под ней:
   на 390 px они перекрывали друг друга и закрывали пол-карты. */
function layoutControls() {
  const narrow = window.innerWidth <= 820;
  const mob = document.getElementById('mobctl'), mw = document.getElementById('mapwrap');
  const lay = document.getElementById('layers'), leg = document.getElementById('legend');
  if (!mob || !lay || !leg) return;
  const host = narrow ? mob : mw;
  if (lay.parentNode !== host) host.append(lay, leg);
}

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.18 : 1 / 1.18);
}, { passive: false });

const ptrs = new Map();
let drag = null, pinch = null;
const pinchStart = () => {
  const [a, b] = [...ptrs.values()];
  return { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, k: S.k, tx: S.tx, ty: S.ty,
           cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 };
};
svg.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 1) {
    drag = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty, moved: 0 };
    svg.classList.add('drag');
  } else if (ptrs.size === 2) { drag = null; pinch = pinchStart(); hideTip(); }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size >= 2) {                       // щипок: масштаб вокруг середины
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (!d) return;
    const r = svg.getBoundingClientRect();
    const k2 = clampK(pinch.k * d / pinch.d), f = k2 / pinch.k;
    const cx = pinch.cx - r.left, cy = pinch.cy - r.top;
    S.k = k2; S.tx = cx - (cx - pinch.tx) * f; S.ty = cy - (cy - pinch.ty) * f;
    applyT(); drawOverlay();
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  S.tx = drag.tx + dx; S.ty = drag.ty + dy; applyT(); drawOverlay();
});
const endDrag = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    if (drag && drag.moved < 4 && e.target === svg) select(null);
    drag = null; svg.classList.remove('drag');
    if (e.pointerType && e.pointerType !== 'mouse') hideTip();
  }
};
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

document.getElementById('zin').onclick = () => zoomAt(S.vw / 2, S.vh / 2, 1.5);
document.getElementById('zout').onclick = () => zoomAt(S.vw / 2, S.vh / 2, 1 / 1.5);
document.getElementById('zfit').onclick = () => { fit(); applyT(); drawOverlay(); };

/* ---------- шапка, слои, подвал ---------- */
function buildChrome() {
  const w = document.getElementById('weeks');
  DATA.snapshots.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.label; b.onclick = () => { stopPlay(); S.week = i; S.t = 1; S.rt = 1; render(); };
    w.append(b);
  });
  const legShip = stopped => {
    const sv = el('svg', { viewBox: '0 0 26 14' });
    if (!stopped) { const a = dirArrow([7, 7], '#78858F', 0, 0); a.setAttribute('transform',
      'translate(7 7) scale(.78)'); sv.append(a); }
    sv.append(dotMarker([7, 7], '#78858F', !stopped, 0));
    return sv.outerHTML;
  };
  const lg = document.getElementById('legend');
  lg.innerHTML = `
   <div><svg viewBox="0 0 26 10"><path d="M1 5h24" stroke="#78858F" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg> фактический трек за 7 суток</div>
   <div><svg viewBox="0 0 26 10"><path d="M1 5h24" stroke="#78858F" stroke-width="1.6" stroke-dasharray="3 4" fill="none" stroke-linecap="round"/></svg> предполагаемый маршрут</div>
   <div>${legShip(0)} судно на ходу (точка пульсирует)</div>
   <div>${legShip(1)} без хода (на якоре)</div>
   <div><svg viewBox="0 0 26 10"><rect x="9" y="1" width="8" height="8" fill="#222B33" stroke="#fff" stroke-width="1.2"/></svg> СПГ-терминал</div>
   <div><svg viewBox="0 0 26 10"><ellipse cx="13" cy="5" rx="11" ry="4.2" fill="#8367C7" opacity=".3"/></svg> зона манёвров за неделю</div>`;
  const map = { cRoutes: 'routes', cPlaces: 'places', cCountries: 'countries', cGrid: 'grid' };
  for (const id in map) document.getElementById(id).addEventListener('change', e => {
    S.layers[map[id]] = e.target.checked;
    L.grid.style.display = S.layers.grid ? '' : 'none';
    render();
  });
  document.getElementById('foot').textContent =
    'Источник: Lloyd’s List Intelligence Seasearcher. Треки оцифрованы со снимков экрана, '
    + 'погрешность ~1°; отдельные участки, закрытые карточкой судна, достроены по прямой. '
    + 'Пунктирные маршруты и расчётные сроки прихода — оценка по средней скорости и истории рейсов, а не данные AIS. '
    + 'Береговая линия и границы государств показаны схематично.';
}

/* ---------- проигрывание по неделям ---------- */
const DRAW_MS = 2600, ROUTE_MS = 1900, HOLD_MS = 700, playBtn = document.getElementById('play');
let playing = false, raf = null, hold = null;
function setPlayUI(on) {
  playBtn.setAttribute('aria-pressed', on);
  playBtn.innerHTML = on
    ? '<svg viewBox="0 0 10 10"><rect x="1" y="1" width="3" height="8" fill="currentColor"/>'
      + '<rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg>Пауза'
    : '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>Проиграть';
}
function stopPlay() {
  playing = false;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (hold) { clearTimeout(hold); hold = null; }
  setPlayUI(false);
  S.t = 1; S.rt = 1; applyProgress(1); applyRoute(1);
}
function runWeek() {
  S.t = 0; S.rt = 0; applyProgress(0); applyRoute(0);
  const t0 = performance.now(), hasRoute = Object.keys(RT).length > 0;
  const total = DRAW_MS + (hasRoute ? ROUTE_MS : 0);
  const frame = now => {
    if (!playing) return;
    const e = now - t0;
    if (e < DRAW_MS) {
      S.t = e / DRAW_MS; applyProgress(S.t); raf = requestAnimationFrame(frame);
    } else if (e < total) {
      if (S.t !== 1) { S.t = 1; applyProgress(1); }
      S.rt = (e - DRAW_MS) / ROUTE_MS; applyRoute(S.rt); raf = requestAnimationFrame(frame);
    } else {
      S.t = 1; S.rt = 1; applyProgress(1); applyRoute(1); raf = null;
      hold = setTimeout(() => {
        if (!playing) return;
        S.week = (S.week + 1) % DATA.snapshots.length;
        render(); runWeek();
      }, HOLD_MS + (hasRoute ? 900 : 0));
    }
  };
  raf = requestAnimationFrame(frame);
}
function startPlay() {
  if (S.week >= DATA.snapshots.length - 1) { S.week = 0; render(); }
  playing = true; setPlayUI(true); runWeek();
}
playBtn.onclick = () => playing ? stopPlay() : startPlay();
setPlayUI(false);

function render() {
  document.querySelectorAll('#weeks button').forEach((b, i) =>
    b.setAttribute('aria-pressed', i === S.week));
  document.getElementById('sub').textContent =
    `${snap().title} 2026 · Lloyd’s List Intelligence Seasearcher, снимки ${snap().shot}`;
  drawWeek(); drawOverlay(); drawList(); drawDetail();
}

drawGeo(); buildChrome(); resize(); render();
window.addEventListener('resize', () => { resize(); render(); });
window.zoomTo = zoomTo;
</script>
</body>
